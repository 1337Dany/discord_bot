[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "discord-audio-bot"
version = "0.1.0"
description = "Discord bot for audio and basic server management"
readme = "README.md"
requires-python = ">=3.13"

dependencies = [
  "discord.py>=2.3.0",
  "sqlalchemy[asyncio]>=2.0.0",
  "psycopg[binary]>=3.3.0",
  "alembic>=1.13.0",
  "pydantic-settings>=2.2.0",
  "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0.0",
  "pytest-asyncio>=0.23.0",
  "black>=24.0.0",
  "ruff>=0.6.0",
  "mypy>=1.10.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]